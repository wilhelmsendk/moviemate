services:
  moviemate:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3210}:3000"
    environment:
      DATABASE_URL: postgresql://moviemate:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/moviemate
      JELLYFIN_URL: ${JELLYFIN_URL:?Set JELLYFIN_URL in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: moviemate
      POSTGRES_DB: moviemate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - moviemate-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moviemate"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  moviemate-db:
